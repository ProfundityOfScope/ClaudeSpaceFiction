<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Lightspeed</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* One-screen ship's console: status bar, scrolling log, one-tap commands, input line.
   Night watch by default; a daylight variant for light themes. */
:root {
  color-scheme: dark;
  --bg: #0d111c;
  --panel: #141a29;
  --line: #262e44;
  --ink: #d9d5c7;
  --dim: #7f879e;
  --mind: #8fd3c8;
  --alert: #e9a94c;
  --good: #e6d58c;
  --ok: #6fbf9b;
  --warn: #e9a94c;
  --crit: #e8705f;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #e9edf2;
    --panel: #f6f8fa;
    --line: #c5cdd8;
    --ink: #18202c;
    --dim: #5b6677;
    --mind: #0d6b63;
    --alert: #94560a;
    --good: #6a5500;
    --ok: #1f7a55;
    --warn: #94560a;
    --crit: #b23a2a;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #e9edf2;
  --panel: #f6f8fa;
  --line: #c5cdd8;
  --ink: #18202c;
  --dim: #5b6677;
  --mind: #0d6b63;
  --alert: #94560a;
  --good: #6a5500;
  --ok: #1f7a55;
  --warn: #94560a;
  --crit: #b23a2a;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: clamp(12.5px, 3.45vw, 15px);
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
}
#app {
  box-sizing: border-box;
  height: 100%;
  max-width: 46rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ---- status bar ---- */
#bar { display: flex; flex-direction: column; gap: 3px; }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; align-items: baseline; }
#where { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; min-width: 0; overflow-wrap: anywhere; }
#clocks, #stores { color: var(--dim); }
.gauges { justify-content: flex-start; gap: 2px 12px; }
.g { display: flex; align-items: center; gap: 5px; }
.g span { color: var(--dim); }
.g i { display: block; width: 1.9rem; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.g i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--v, 0%); background: var(--c, var(--ok)); border-radius: 3px; }
.g b { font-weight: 500; min-width: 3ch; }

/* ---- the log ---- */
#log, #panel {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  border-block: 1px solid var(--line);
  padding-block: 8px;
}
#log { display: flex; flex-direction: column; gap: 2px; }
.o { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.o.pre { white-space: pre; overflow-x: auto; line-height: 1.32; padding-block: 4px; flex: none; }
/* A map is drawn one cell to a pixel and scaled up unsmoothed, so it stays as blocky as the text around it. */
.o.map { margin: 0; padding-block: 6px 2px; display: flex; flex-direction: column; gap: 4px; flex: none; }
.o.map canvas { display: block; width: min(100%, 19rem); aspect-ratio: 1; image-rendering: crisp-edges; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 2px; }
.o.map figcaption { color: var(--dim); }
.o.echo { color: var(--dim); margin-top: 12px; }
.o.mind { color: var(--mind); }
.o.head { font-weight: 600; letter-spacing: .05em; margin-top: 4px; }
.o.dim { color: var(--dim); }
.o.good { color: var(--good); }
.o.alert { color: var(--alert); }

/* ---- commands ---- */
#chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
#chips::-webkit-scrollbar { display: none; }
button {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 11px;
  white-space: nowrap;
  cursor: pointer;
  flex: none;
}
button:hover { border-color: var(--dim); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--mind); outline-offset: 1px; }
#entry { display: flex; gap: 8px; align-items: center; flex: none; }
#entry label { color: var(--mind); font-weight: 600; }
/* 16px keeps phones from zooming the page when the field takes focus. */
input, textarea {
  font-family: var(--mono);
  font-size: 16px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 10px;
  box-sizing: border-box;
}
#cmd { flex: 1; min-width: 0; }

/* ---- save menu ---- */
#panel { display: flex; flex-direction: column; gap: 14px; }
#panel section { display: flex; flex-direction: column; gap: 6px; }
#panel h2 { margin: 0; font-size: inherit; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
#panel p { margin: 0; color: var(--dim); max-width: 60ch; }
#panel textarea { width: 100%; resize: vertical; font-size: 13px; }
#panel .acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
#panel input { width: 11rem; max-width: 100%; }
#note { color: var(--good); min-height: 1.5em; }

@media (prefers-reduced-motion: no-preference) {
  .o.fresh { animation: settle .18s ease-out; }
  @keyframes settle { from { opacity: .25; } to { opacity: 1; } }
}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="row"><span id="where">Lightspeed</span><span id="clocks"></span></div>
    <div class="row gauges">
      <span class="g" id="g-fuel"><span>fuel</span><i></i><b></b></span>
      <span class="g" id="g-shield"><span>shld</span><i></i><b></b></span>
      <span class="g" id="g-hull"><span>hull</span><i></i><b></b></span>
      <span id="stores"></span>
    </div>
  </header>

  <main id="log" role="log" aria-live="polite" aria-label="Ship's log"></main>

  <div id="panel" hidden>
    <section>
      <h2>This voyage</h2>
      <p id="seedline"></p>
    </section>
    <section>
      <h2>Keep a copy</h2>
      <p>The voyage saves itself in this browser. To move it to another device, copy this text and load it there.</p>
      <textarea id="savetext" rows="4" readonly aria-label="Save text"></textarea>
      <div class="acts"><button id="copy" type="button">Copy save</button></div>
    </section>
    <section>
      <h2>Load a copy</h2>
      <textarea id="loadtext" rows="3" aria-label="Paste a save here" placeholder="Paste a save here"></textarea>
      <div class="acts"><button id="load" type="button">Load it</button></div>
    </section>
    <section>
      <h2>New voyage</h2>
      <p>Each seed number is its own galaxy. Send someone the same number and they wake in the same sky.</p>
      <div class="acts">
        <input id="newseed" inputmode="numeric" aria-label="Seed number">
        <button id="begin" type="button">Begin</button>
      </div>
    </section>
    <div id="note" role="status"></div>
    <div class="acts"><button id="close" type="button">Back to the log</button></div>
  </div>

  <nav id="chips" aria-label="Suggested commands"></nav>
  <form id="entry" autocomplete="off">
    <label for="cmd" aria-label="Command">&gt;</label>
    <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="type a command">
    <button id="menu" type="button">menu</button>
  </form>
</div>

    assign(op, arg) {
      const sys = this.here;
      const s = this.state;
      if (!this.mem.swept) {
        this.text("Nothing here has been looked at yet. Sweep first.");
        return;
      }
      const free = s.crews.findIndex((c) => c === null);
      if (free < 0) {
        this.text(`${s.crews.length === 2 ? "Both" : "All"} crews are busy. Recall one first ("recall 1").`);
        return;
      }
      let body = -1;
      const job = { op, body: -1, days: 0 };
      if (op === "scoop" || op === "ice" || op === "mine" || op === "scan") {
        body = Number(arg);
        const b = sys.bodies[body];
        if (arg === "" || !Number.isInteger(body) || !b) {
          this.text(`Which body? For example "${op} ${op === "scoop" ? sys.bodies.find((x) => x.fuel)?.n ?? 0 : 1}".`);
          return;
        }
        if (s.crews.some((c) => c && c.op === op && c.body === body)) {
          this.text("A crew is already on that.");
          return;
        }
        const ref = bodyRef(sys, body);
        if (op !== "scan" && this.homes().has(body)) {
          this.text(`${capital(ref)} is somebody's home. We take nothing from it.`);
          return;
        }
        if (op === "scoop" && !(b.kind === "star" ? STARS[sys.star].wind : b.fuel > 0)) {
          this.text(`There is nothing to scoop at ${ref}.`);
          return;
        }
        if (op === "ice" && !b.ice) {
          this.text(`No ice worth cutting at ${ref}.`);
          return;
        }
        if (op === "mine" && !b.ore) {
          this.text(`Nothing worth mining at ${ref}.`);
          return;
        }
        if (op === "scan") {
          const target = this.scanTargets().find((t) => t.body === body);
          if (!target) {
            this.text(`Nothing at ${ref} asks for a deep scan. The survey flags what does.`);
            return;
          }
          if (target.site) job.site = target.site.culture.id;
          else job.feature = target.feature.id;
          job.need = target.days;
        }
        job.body = body;
      }
      if (op === "survey" && this.mem.found >= sys.discoveries.length) {
        this.text("The survey has nothing left to find here.");
        return;
      }
      if (op === "repair") {
        if (s.ship.hull >= 99.5) {
          this.text("The hull is sound.");
          return;
        }
        if (s.ship.materials < 1) {
          this.text("The Wrights have nothing to mend with. Mine something first.");
          return;
        }
      }
      s.crews[free] = job;
      this.text(`Crew ${free + 1}: ${this.describe(job)}.`);

    recall(arg) {
      const s = this.state;

        s.crews = s.crews.map((c) => c?.op === "refit" ? c : null);
        this.text("Crews recalled.");
        return;
      }
      const i = Number(arg) - 1;
      const crew = s.crews[i];
      if (!Number.isInteger(i) || crew === void 0) {
        this.text(`There is no crew ${arg}.`);
        return;
      }
      if (crew?.op === "refit") {
        this.text("That crew is mid-refit with the ship in pieces. They will finish.");
        return;

    /** Log one survey discovery; returns true if it is rare enough to stop for. */
    reveal(d, day, charted) {
      const sys = this.here;
      const s = this.state;
      const stamp = `Day ${day}. `;
      if (d.type === "body") {
        const b = sys.bodies[d.body];
        const worth = [];
        if (b.fuel) worth.push(`fuel ${RICH[b.fuel]}`);
        if (b.ice) worth.push(`ice ${RICH[b.ice]}`);
        if (b.ore) worth.push(`ore ${RICH[b.ore]}`);
        s.ship.archive += TUNE.ARCHIVE_BODY;
        charted.push(`${bodyRef(sys, d.body)} (${worth.join(", ") || "nothing to work"})`);
        return false;
      }
      const def = d.feature;
      const before = s.seen[def.id] ?? 0;
      const base = TUNE.ARCHIVE[def.rarity];
      if (def.hint) {
        const credit2 = Math.max(1, Math.round(base * TUNE.HINT_SHARE));
        s.ship.archive += credit2;
        this.out.push({ k: "alert", s: `${stamp}${renderFeature(sys, d.body, def.hint, def.id)} (+${credit2})` });
        this.dim(`"scan ${d.body}" would settle it, in about ${TUNE.SCAN_DAYS[def.rarity]} days.`);
        if (!s.visit.hinted) {
          s.visit.hinted = true;
          this.say("find_hint");
        }
        return true;
      }
      const credit = Math.max(1, Math.round(before === 0 ? base * TUNE.FIRST_BONUS : base / Math.sqrt(before + 1)));
      s.seen[def.id] = before + 1;
      s.ship.archive += credit;
      s.stats.finds++;
      if (before === 0 || def.rarity === 3) {
        this.text(`${stamp}${renderFeature(sys, d.body, def.text, def.id)} (+${credit}${before === 0 ? ", first logged" : ""})`);
      } else if (def.rarity === 2) {
        this.text(`${stamp}${capital(def.title)} again, at ${bodyRef(sys, d.body)}. The ${ordinal(before + 1)} in the Archive. (+${credit})`);
      } else {
        this.text(`${stamp}${capital(def.title)} again, at ${bodyRef(sys, d.body)}. (+${credit})`);
      }
      if (def.rarity >= 2) {
        this.note(`${capital(def.title)} at ${this.nameOf(sys.ref.id)}.`);
        if (before === 0 || def.rarity === 3) this.say(def.rarity === 3 ? "find_exceptional" : "find_rare");

    finishScan(a, day) {
      const sys = this.here;
      const s = this.state;
      const def = FEATURE_BY_ID[a.feature];
      const before = s.seen[def.id] ?? 0;
      const share = TUNE.ARCHIVE[def.rarity] * (1 - TUNE.HINT_SHARE);
      const credit = Math.round(before === 0 ? share * TUNE.FIRST_BONUS : share);
      s.seen[def.id] = before + 1;
      s.ship.archive += credit;
      s.stats.finds++;
      this.mem.scanned.push(def.id);
      const again = before > 0 && def.rarity < 3;
      this.good(
        again ? `Day ${day}. Deep scan complete. ${capital(def.title)}, at ${bodyRef(sys, a.body)}. The ${ordinal(before + 1)} such place in the Archive.` : `Day ${day}. Deep scan complete. ${renderFeature(sys, a.body, def.text, def.id)}`
      );
      this.dim(`${capital(RARITY_WORD[def.rarity])} find. Archive +${credit}${before === 0 ? ", first of its kind" : ""}.`);
      const relic = def.relic && mix(s.seed, K.RELIC, strHash(sys.ref.id), strHash(def.id)) / 4294967296 < def.relic.chance ? def.relic : null;

        s.ship.relics.push({ what: relic.what, kind: relic.kind, of: "", t: s.tGal });

      }
      if (!again) this.say(relic ? "relic" : def.rarity === 3 ? "find_exceptional" : "find_rare");

    /** A crew has finished reading a ruin: whose it was, what it adds to the Archive, and now and then something to carry away. */
    finishRuin(a, day) {

      const c = this.cultures.byId(id);
      if (!c) return;
      const site = this.people().sites.find((x) => x.culture.id === id);
      const home = c.home.id === sys.ref.id;
      const old = site ? site.phase === "old ruins" : true;
      const key = strHash(c.id + sys.ref.id);
      const before = s.seen.ruin ?? 0;
      const fresh = this.learn(c, "ruins");
      const worth = CIV.RUIN_ARCHIVE[home ? "home" : "outpost"] * (old ? CIV.RUIN_OLD : 1) * (fresh ? 1 : 0.6) * (before === 0 ? TUNE.FIRST_BONUS : 1);

      s.seen.ruin = before + 1;
      s.ship.archive += credit;
      s.stats.finds++;

      this.good(`Day ${day}. Deep scan complete. ${found}${site ? ` Empty for ${roughly(s.tGal - site.since)}.` : ""}`);
      if (fresh) this.text(`By their own account: ${c.sketch}`);
      this.dim(`${old ? "Old ruins" : "Ruins"} of ${c.title}${home ? ", on their home world" : ""}. Archive +${credit}${before === 0 ? ", the first ruin read" : ""}.`);

      }
    }
    stay(arg) {
      const s = this.state;
      const sys = this.here;
      let days = 0;
      let auto = false;
      if (arg === "") {
        auto = true;
        days = 400;
      } else {
        const m = /^(\d+(?:\.\d+)?)\s*([a-z]*)$/i.exec(arg);
        if (!m) {
          this.text('How long? For example "stay 30", "stay 6w", "stay 3m" or "stay 1y".');
          return;
        }
        const unit2 = m[2].toLowerCase();
        const scale = unit2.startsWith("y") ? DAYS : unit2.startsWith("m") ? 30.4 : unit2.startsWith("w") ? 7 : 1;
        days = Math.min(3653, Math.max(1, Math.round(Number(m[1]) * scale)));
      }
      if (auto && s.crews.every((c) => c === null)) {
        this.text("No crew is working, so nothing would change but the date. Give a number of days to wait anyway.");
        return;
      }
      const before = { fuel: this.fuelPct, shield: s.ship.shield, hull: s.ship.hull, materials: s.ship.materials, archive: s.ship.archive };
      const hold = level(s, "hold");
      const charted = [];
      let idle = 0;
      let worked = false;
      let passed = 0;
      let stop = false;
      const day0 = Math.round((s.tShip - s.visit.arrived) * DAYS);
      for (let n = 1; n <= days && !stop; n++) {
        passed = n;
        const day = day0 + n;
        for (let i = 0; i < s.crews.length; i++) {
          const a = s.crews[i];
          if (!a) {
            idle++;
            continue;
          }
          const done = (why) => {
            s.crews[i] = null;
            this.text(`Day ${day}. Crew ${i + 1}: ${why}`);
            if (auto) stop = true;
          };
          a.days++;
          worked = true;
          switch (a.op) {
            case "scoop":
              s.ship.fuel = Math.min(this.tank, s.ship.fuel + this.scoopRate(sys.bodies[a.body]) / 100 * this.tank);
              if (s.ship.fuel >= this.tank) done("tanks full.");
              break;
            case "ice":
              s.ship.shield = Math.min(100, s.ship.shield + TUNE.ICE[sys.bodies[a.body].ice]);
              if (s.ship.shield >= 100) done("shield whole.");
              break;
            case "mine":
              s.ship.materials = Math.min(hold, s.ship.materials + TUNE.ORE[sys.bodies[a.body].ore]);
              if (s.ship.materials >= hold) done("the hold is full.");
              break;

              while (this.mem.found < total && this.mem.effort >= this.surveyDay(this.mem.found + 1)) {

                if (rare && auto) stop = true;
              }
              if (this.mem.found >= total) {
                s.ship.archive += 5;
                done("survey complete. System fully charted. (+5)");
                if (s.stats.systems % 3 === 0) this.say("survey_done");
              } else if (!s.visit.slow && this.mem.found / total > 0.7) {
                s.visit.slow = true;
                if (s.stats.systems % 3 === 1) this.say("survey_slow");
              }
              break;
            }
            case "scan":
              if (a.days >= (a.need ?? 0)) {
                if (a.site) this.finishRuin(a, day);
                else this.finishScan(a, day);
                s.crews[i] = null;
                if (auto) stop = true;
              }
              break;
            case "repair": {
              const step = Math.min(TUNE.REPAIR_RATE, 100 - s.ship.hull, s.ship.materials / TUNE.REPAIR_COST);
              s.ship.hull += step;
              s.ship.materials -= step * TUNE.REPAIR_COST;
              if (s.ship.hull >= 99.99) done("hull sound.");
              else if (s.ship.materials < 0.01) done("out of materials; repairs stop.");
              break;
            }
            case "refit":
              if (a.days >= (a.need ?? 0)) {
                const track = a.track;
                s.ship.levels[track]++;
                if (track === "crews") s.crews.push(null);
                const info = REFITS[track];
                this.good(`Day ${day}. Refit complete: ${info.label.toLowerCase()} now ${level(s, track)}${info.unit ? ` ${info.unit}` : ""}.`);
                this.note(`Refit at ${this.nameOf(s.at)}: ${info.label.toLowerCase()} ${level(s, track)}.`);
                if (track === "tanks") this.dim(`Bigger tanks, the same fuel: the gauge now reads ${Math.round(this.fuelPct)}%.`);
                this.say("refit_done");
                s.crews[i] = null;
                if (auto) stop = true;
              }

          }
        }

        s.tGal += 1 / DAYS;
        s.ship.hull = Math.max(TUNE.HULL_FLOOR, s.ship.hull - TUNE.AGE_WEAR / DAYS);
      }
      if (charted.length) this.text(`Charted: ${charted.join("; ")}.`);
      const living = this.people().sites.filter((x) => x.alive);
      const noted = this.mem.seen.filter((x) => isLiving(x.phase));
      if (living.length !== noted.length || living.some((x) => !noted.some((n) => n.id === x.culture.id && n.phase === x.phase))) this.takeNote("stay");
      const parts = [`${passed} ${passed === 1 ? "day passes" : "days pass"}.`];
      const change = (label, a, b, unit2) => {

      change("Shield", before.shield, s.ship.shield, "%");
      change("Hull", before.hull, s.ship.hull, "%");
      change("Hold", before.materials, s.ship.materials, "");

    /**
     * The numbers behind a map: gas in a square grid around the ship, and the

     * character map instead.

    picture(radius, stars, held = []) {
      const here = this.here.ref;
      const size = MAP_SIZE;
      let gas = "";
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const x = here.x + ((c + 0.5) / size * 2 - 1) * radius;
          const y = here.y + (1 - (r + 0.5) / size * 2) * radius;
          gas += gasLevel(this.galaxy.gas(x, y));
        }
      }
      const placed = [];
      for (const { seen, n, odd, signal } of stars) {
        const dx = (seen.ref.x - here.x) / radius;
        const dy = (seen.ref.y - here.y) / radius;
        if (Math.abs(dx) >= 1 || Math.abs(dy) >= 1) continue;
        placed.push({
          x: Math.floor((dx + 1) / 2 * size),
          y: Math.floor((1 - dy) / 2 * size),
          tone: TONE[this.system(seen.ref.id).star],
          size: seen.ref.stratum >= 3 ? 3 : seen.ref.stratum === 2 ? 2 : 1,
          n,
          visited: this.state.mem[seen.ref.id] ? true : void 0,
          odd: odd || void 0,
          signal: signal || void 0
        });
      }
      const rings = held.map(({ ref, r }) => ({
        x: Math.floor(((ref.x - here.x) / radius + 1) / 2 * size),
        y: Math.floor((1 - (ref.y - here.y) / radius) / 2 * size),
        r: Math.round(r / radius * (size / 2))
      }));
      return { size, radius, gas, stars: placed, rings: rings.length ? rings : void 0 };

    /** The wider sky: where the gas is thick and thin, and the bright stars to steer by. */
    gas() {
      const s = this.state;
      const here = this.here.ref;
      const optics = level(s, "optics");
      const radius = 100 * optics;
      const cols = 41;
      const rows = 13;
      const grid = [];
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          let n = 0;
          for (const dr of [-0.33, 0, 0.33]) {
            n = Math.max(n, this.galaxy.gas(here.x + (c - 20) / 20 * radius, here.y + (6 - r + dr) / 6 * radius));
          }
          row.push(shade(n));
        }
        grid.push(row);
      }
      const bright = this.galaxy.near(here.x, here.y, optics).filter((x) => x.ref.id !== here.id && x.ref.stratum >= 2 && x.dist <= radius).slice(0, 9);
      const signals = this.cultures.signals(here.x, here.y, s.tGal, Math.min(radius, HEARING));
      const loud = new Set(signals.map((x) => x.seen.ref.id));
      const voices = signals.filter((x) => !bright.some((b) => b.ref.id === x.seen.ref.id)).slice(0, 5).map((x) => x.seen);
      const listed = [...bright, ...voices];
      listed.forEach((x, i) => {
        const c = 20 + Math.round((x.ref.x - here.x) / radius * 20);
        const r = 6 - Math.round((x.ref.y - here.y) / radius * 6);
        if (r >= 0 && r < rows && c >= 0 && c < cols) grid[r][c] = i < bright.length ? String(i + 1) : "^";
      });
      grid[6][20] = "@";
      const held = signals.filter((x) => x.site.kind === "home" && x.site.culture.reach).map((x) => ({ ref: x.seen.ref, r: frontier(x.site.culture, s.tGal - x.seen.dist) })).filter((x) => x.r >= 2);

        k: "map",
        s: [
          ...grid.map((row) => row.join("").trimEnd()),
          `gas: blank void, . thin, : moderate, % dense, # cloud \xB7 @ us \xB7 edge at ${ly(radius)} ly`
        ].join("\n"),
        map: this.picture(
          radius,
          // The voices are nearly always close in, where numbers would pile up on the ship: they get a mark, and the list has the rest.
          [
            ...signals.filter((x) => !bright.some((b) => b.ref.id === x.seen.ref.id)).map((x) => ({ seen: x.seen, signal: true })),
            ...bright.map((x, i) => ({ seen: x, n: i + 1, signal: loud.has(x.ref.id) }))

          held

      const lines = [];
      if (listed.length) {
        s.chart = listed.map((x) => x.ref.id);
        lines.push(" #  system           ly star  way");
        listed.forEach((x, i) => {
          const sys = this.system(x.ref.id);
          const leg = planLeg(this.galaxy, here, x.ref, this.drive, 1);
          const way = `${Galaxy.gasWord(leg.gasMean)}${leg.gasMax >= 10 && leg.gasMean < 10 ? " #" : ""}`;
          lines.push(
            `${lpad(String(i + 1), 2)}${s.mem[x.ref.id] ? "*" : " "} ${pad(this.nameOf(x.ref.id), 14)}${lpad(ly(x.dist), 5)} ${pad(STARS[sys.star].code, 5)} ${pad(way, 10)} ${loud.has(x.ref.id) ? "^" : ""}`.trimEnd()
          );
        });
      }
      if (lines.length) this.pre(lines);
      const notes = ["Thin gas is fast going; a cloud is a wall (# marks one across the way)."];
      notes.push(bright.length ? "These are the bright stars in range." : `No bright stars within ${ly(radius)} light-years.`);
      if (voices.length || loud.size) notes.push("^ marks a signal: somebody was broadcasting when that light left.");
      if (listed.length) notes.push('"plot" works on these numbers.');
      this.dim(notes.join(" "));
      const first = listed.findIndex((x) => loud.has(x.ref.id));
      if (first >= 0) this.sayOnce("signal_first", "signal_first", { n: first + 1, light: spanWords(listed[first].dist) });
    }
    /** A system with something odd in it that we have not yet resolved. */
    unresolvedAnomaly(id) {

      const mem = this.state.mem[id];
      if (!mem) return true;

    }
    target(arg) {

        return null;

      if (arg === "" || !Number.isInteger(i) || !s.chart[i]) {
        this.text(`Which one? Give a number from the chart, 1 to ${s.chart.length}.`);
        return null;

      return this.system(s.chart[i]);

        parts.push(`${giants}, and ${dust}.`);

        parts.push(`There is radio from there, structured and ${spanWords(dist)} old. ${who}. Whether they are still there is another matter.`);
      }
      const leg = planLeg(this.galaxy, here, sys.ref, this.drive, 1);
      parts.push(`The way there lies through ${Galaxy.gasWord(leg.gasMean)} gas${leg.gasMax >= 10 && leg.gasMean < 10 ? ", with a cloud across it" : ""}.`);

    /** What a leg would cost and leave us with. */
    cost(leg) {

        fuelAfter: this.fuelPct - 100 * leg.fuel / this.tank,

        hullAfter: s.ship.hull - hullLoss,
        breach,
        hullLoss

    plot(arg) {

      const after = (label, c) => c.fuelAfter < 0 ? ` ${pad(label, 9)}  not enough fuel` : ` ${pad(label, 9)}${lpad(`${Math.round(c.fuelAfter)}%`, 6)}${lpad(`${Math.round(c.shieldAfter)}%`, 8)}${lpad(`${Math.max(0, Math.round(c.hullAfter))}%`, 7)}`;
      this.pre([
        ` to ${this.nameOf(sys.ref.id)} \xB7 ${ly(hard.dist)} ly \xB7 gas ${Galaxy.gasWord(hard.gasMean)}`,
        "",
        "            aboard   outside",
        time("hard", hard),
        time("eco", eco),
        "",
        " arriving   fuel  shield   hull",
        after("hard", ch),
        after("eco", ce)

      const vars = { fuel: Math.max(0, Math.round(ch.fuelAfter)), hull: Math.round(ch.breach), ship: spanWords(hard.ship), outside: spanWords(hard.galaxy), gas: Galaxy.gasWord(hard.gasMean) };
      const quiet = (s.visit.plots ?? 0) > 0;
      s.visit.plots = (s.visit.plots ?? 0) + 1;
      if (ch.fuelAfter < 0) this.say(ce.fuelAfter < 0 ? "plot_nothing" : "plot_nofuel");
      else if (ch.breach >= 2) this.say("plot_shield", vars);
      else if (hard.gasMax >= 10) this.say("plot_cloud");
      else if (ch.fuelAfter < 15) this.say("plot_tight", vars);
      else if (hard.ship > 5) this.say("plot_long", vars);
      else if (!quiet) this.say(hard.gasMean < 0.2 ? "plot_thin" : "plot_ok", vars);

    burn(arg) {

      if (s.crews.some((c2) => c2?.op === "refit")) {

      const to = this.system(s.plot);

      const c = this.cost(leg);
      if (c.fuelAfter < 0) {
        this.text(`Not enough fuel: that burn needs ${Math.round(c.fuelPct)}% of a tank and we have ${Math.round(this.fuelPct)}%.${eco ? ' If nothing nearer will do, "drift" is the last resort.' : ' Try "burn eco".'}`);
        return;
      }
      if (s.ship.hull - c.hullLoss < TUNE.HULL_FLOOR) {

        return;
      }
      const lowFuel = c.fuelAfter < 6 && to.giants === 0;

        s.mind.overruled++;
        const n = s.mind.overruled;
        this.say((s.mind.streak ?? 0) >= 4 ? "dissent_weary" : n >= 3 ? "dissent_again" : "dissent", { n, last: n - 1 });

    /** No fuel and nowhere to get any: fall to the nearest plotted star the slow way. */
    drift() {

      const to = this.system(s.plot);
      const eco = planLeg(this.galaxy, from.ref, to.ref, this.drive, TUNE.ECO);
      const canScoop = from.bodies.some((b) => b.fuel > 0) || STARS[from.star].wind;

      const cost = refitCost(track, s.ship.levels[track]);
      if (state === "max") return this.text("That is already as good as the Wrights can make it.");
      if (state === "busy") return this.text("That refit is already in the yard.");
      if (state === "archive") return this.text(`The Wrights don't know how yet. That needs ${cost.archive} in the Archive; we have ${s.ship.archive}.`);
      if (state === "materials") return this.text(`That needs ${cost.materials} materials; we have ${Math.round(s.ship.materials)}.`);
      const free = s.crews.findIndex((c) => c === null);
      if (free < 0) return this.text("No crew is free to do it. Recall one first.");
      s.ship.materials -= cost.materials;
      s.crews[free] = { op: "refit", body: -1, days: 0, need: cost.days, track };
      this.text(`Crew ${free + 1} to the yard: ${REFITS[track].label.toLowerCase()} refit, ${cost.days} days. We cannot burn until it is done.`);
      this.say("refit_start", { days: cost.days });
    }
    log() {
      const entries = this.state.journal.slice(-14);
      this.pre(entries.map((e) => `${lpad(clock(e.g), 9)}  ${e.text}`));
      this.dim("Dates are years outside since you were woken.");
    }
    finds() {
      const s = this.state;
      const lines = [];
      for (const category of ["geology", "dynamics", "stellar", "life", "artefact"]) {
        const all = FEATURES.filter((f2) => f2.category === category);
        const got = all.filter((f2) => s.seen[f2.id]);
        lines.push(` ${pad(category, 9)} ${got.length} of ${all.length}`);
        for (const f2 of got) lines.push(`   ${f2.title}${s.seen[f2.id] > 1 ? ` x${s.seen[f2.id]}` : ""}`);
      }
      const stars = Object.keys(STARS).filter((k) => s.seen[`star:${k}`]);
      lines.push(` ${pad("stars", 9)} ${stars.length} of ${Object.keys(STARS).length} kinds`);
      const peoples = Object.values(s.met);
      lines.push(` ${pad("peoples", 9)} ${peoples.length} known \xB7 ${s.seen.ruin ?? 0} ruins read`);
      for (const m of peoples.slice(-12)) {
        lines.push(`   ${pad(m.title.replace(/^the /, ""), 21)} ${pad(m.how, 5)} ${lpad(clock(m.t), 9)}`);
      }
      this.pre(lines);
      if (peoples.length) this.dim("Peoples: how we know them, and the year outside when we first did.");
    }
    rename(arg) {
      const name = arg.trim().replace(/[^\w' -]/g, "").slice(0, 16);
      if (!name) {
        this.text('Name it what? For example "name Halfway".');
        return;
      }
      const old = this.nameOf(this.state.at);
      this.mem.name = name;
      this.note(`Named ${old} "${name}".`);
      this.text(`${old} is ${name} in our charts from now on.`);
    }
    help() {
      this.pre([
        " the loop: sweep, put crews to work, stay;",
        " then chart, plot and burn",
        "",
        " here",
        "  sweep       first look at this system",
        "  look        the system table again (map)",
        "  ops         crews and the work on offer",
        "  scoop N     fuel from a giant (0 = star)",
        "  ice N       rebuild the shield",
        "  mine N      materials for the hold",
        "  survey      chart the system, slowly",
        "  scan N      deep scan: oddity or ruin",
        "  repair      mend the hull with materials",
        "  recall N    free a crew",
        "  stay [30]   let days pass (d w m y)",
        " away",
        "  chart       neighbouring systems",
        "  gas         the wider sky, with its gas",
        "  scope N     what the telescope sees",
        "  plot N      what going there costs",
        "  burn        go, at full thrust",
        "  burn eco    go gently: frugal and slow",
        " the ship",
        "  ask         what the Mind thinks",
        "  ship        condition and clocks",
        '  refits      upgrades, and "refit X"',
        "  log, finds  journal and catalogue",
        "  name X      name this system"
      ]);
    }
  };

  // src/web/main.ts
  var $ = (id) => document.getElementById(id);
  var log = $("log");
  var chips = $("chips");
  var cmd = $("cmd");
  var panel = $("panel");
  var note = $("note");
  var game;
  var history = [];
  var historyAt = 0;
  var slot = (seed) => `lightspeed.save.${seed}`;
  function read(key) {
    try {
      return localStorage.getItem(key);
    } catch {
      return null;
    }
  }
  function write(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch {
    }
  }
  function seedFromUrl() {
    const fromQuery = new URLSearchParams(location.search).get("seed");
    const fromHash = /^#seed-(\d+)$/.exec(location.hash)?.[1];
    const n = Number(fromQuery ?? fromHash ?? read("lightspeed.last") ?? DEMO.seed);
    return Number.isInteger(n) && n > 0 && n < 2 ** 31 ? n : DEMO.seed;
  }
  var DIGITS = [
    "111101101101111",
    "010110010010111",
    "111001111100111",
    "111001111001111",
    "101101111001001",
    "111100111001111",
    "111100111101111",
    "111001001001001",
    "111101111101111",
    "111101111001111"
  ];
  function token(name) {
    const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const hex = /^#([0-9a-f]{6})$/i.exec(raw)?.[1] ?? "808080";
    return [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16));
  }
  var blend = (a, b, t) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",")})`;
  function drawMap(map) {
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = map.size;
    const ctx = canvas.getContext("2d");
    if (!ctx) return null;
    const bg = token("--bg");
    const ink = token("--ink");
    const tones = { warm: token("--alert"), gold: token("--good"), white: ink, cold: token("--mind") };
    const cells = (color, points) => {
      ctx.fillStyle = color;
      for (const [x, y] of points) ctx.fillRect(x, y, 1, 1);
    };
    const haze = [0, 0.12, 0.27, 0.45, 0.68].map((t) => blend(bg, token("--dim"), t));
    for (let i = 0; i < map.gas.length; i++) cells(haze[Number(map.gas[i])], [[i % map.size, Math.floor(i / map.size)]]);
    const voice = token("--ok");
    for (const ring of map.rings ?? []) {
      const points = [];
      const steps = Math.max(12, Math.round(8 * ring.r));
      for (let i = 0; i < steps; i++) {
        const a = i / steps * 2 * Math.PI;
        points.push([Math.round(ring.x + ring.r * Math.cos(a)), Math.round(ring.y + ring.r * Math.sin(a))]);
      }
      cells(blend(bg, voice, 0.5), points);
    }
    const m = map.size / 2;
    const taken = [[m - 2, m - 2, m + 2, m + 2]];
    const numbered = map.stars.filter((star) => star.n).sort((a, b) => (a.n ?? 0) - (b.n ?? 0));
    for (const star of [...map.stars.filter((star2) => !star2.n), ...numbered]) {
      const { x, y } = star;
      const color = star.signal && !star.n ? blend(bg, voice, 1) : blend(bg, tones[star.tone], star.n ? 1 : 0.55);
      cells(color, [[x, y]]);
      if (star.size >= 2) cells(color, [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]);
      if (star.size >= 3) cells(color, [[x + 2, y], [x - 2, y], [x, y + 2], [x, y - 2]]);
      if (star.visited) cells(blend(bg, ink, 0.55), [[x - 1, y + star.size + 1], [x, y + star.size + 1], [x + 1, y + star.size + 1]]);
      if (star.odd) cells(blend(bg, tones.warm, 1), [[x - 3, y - 2], [x - 3, y - 1], [x - 3, y], [x - 3, y + 2]]);
      if (star.signal) {
        const top = y - star.size - 2;
        cells(blend(bg, voice, 1), [[x, top], [x - 1, top + 1], [x + 1, top + 1]]);
      }
      if (star.n) taken.push([x - star.size, y - star.size - (star.signal ? 3 : 0), x + star.size, y + star.size]);
    }
    const clash = (box) => taken.some((t) => box[0] <= t[2] && box[2] >= t[0] && box[1] <= t[3] && box[3] >= t[1]);
    for (const star of numbered) {
      const text = String(star.n);
      const width = text.length * 4 - 1;
      const gap = star.size + 1;
      const spots = [
        [star.x + gap, star.y - 2],
        [star.x - gap - width + 1, star.y - 2],
        [star.x - Math.floor(width / 2), star.y - gap - 4],
        [star.x - Math.floor(width / 2), star.y + gap],
        [star.x + gap, star.y - gap - 4],
        [star.x + gap, star.y + gap],
        [star.x - gap - width + 1, star.y - gap - 4],
        [star.x - gap - width + 1, star.y + gap]
      ].map(([left2, top2]) => [Math.min(map.size - width - 1, Math.max(1, left2)), Math.min(map.size - 6, Math.max(1, top2))]);
      const [left, top] = spots.find(([l, t]) => !clash([l, t, l + width - 1, t + 4])) ?? spots[0];
      taken.push([left - 1, top - 1, left + width, top + 5]);
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = blend(bg, bg, 0);
      ctx.fillRect(left - 1, top - 1, width + 2, 7);
      ctx.globalAlpha = 1;
      [...text].forEach((digit, d) => {
        const points = [];
        [...DIGITS[Number(digit)]].forEach((on, i) => on === "1" && points.push([left + d * 4 + i % 3, top + Math.floor(i / 3)]));
        cells(blend(bg, ink, 1), points);
      });
    }
    cells(blend(bg, bg, 0), [[m, m]]);
    cells(blend(bg, tones.cold, 1), [[m - 1, m - 1], [m, m - 1], [m + 1, m - 1], [m - 1, m], [m + 1, m], [m - 1, m + 1], [m, m + 1], [m + 1, m + 1]]);
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", "Map of the sky around the ship");
    return canvas;
  }
  function print(items) {
    let first = null;
    for (const item of items) {
      let el;
      const picture = item.k === "map" && item.map ? drawMap(item.map) : null;
      if (picture && item.map) {
        el = document.createElement("figure");
        el.className = "o map fresh";
        const caption = document.createElement("figcaption");
        const edge = item.map.radius < 10 ? item.map.radius.toFixed(1) : Math.round(item.map.radius);
        const voices = item.map.rings?.length || item.map.stars.some((star) => star.signal);
        caption.textContent = `edge at ${edge} ly \xB7 haze is gas, stronger is thicker \xB7 the hollow square is us${voices ? " \xB7 green is somebody" : ""}`;
        el.append(picture, caption);
      } else {
        const block = item.k === "pre" || item.k === "map";
        el = document.createElement(block ? "pre" : "p");
        el.className = `o ${block ? "pre" : item.k} fresh`;
        el.textContent = item.s;
      }
      log.appendChild(el);
      first ?? (first = el);
    }
    while (log.childElementCount > 700) log.firstElementChild?.remove();
    if (!first) return;
    const tall = log.scrollHeight - first.offsetTop > log.clientHeight;
    log.scrollTop = tall ? first.offsetTop - log.offsetTop - 4 : log.scrollHeight;
  }
  function gaugeEl(id, value) {
    const el = $(id);
    const bar = el.querySelector("i");
    bar.style.setProperty("--v", `${Math.max(0, Math.min(100, value))}%`);
    bar.style.setProperty("--c", value < 20 ? "var(--crit)" : value < 45 ? "var(--warn)" : "var(--ok)");
    el.querySelector("b").textContent = String(Math.round(value));
  }
  function refresh() {
    const s = game.status();
    $("where").textContent = s.system;
    $("clocks").textContent = `aboard ${s.aboard} \xB7 outside ${s.outside}`;
    $("stores").textContent = `hold ${Math.round(s.materials)}/${s.hold} \xB7 archive ${s.archive}`;
    gaugeEl("g-fuel", s.fuel);
    gaugeEl("g-shield", s.shield);
    gaugeEl("g-hull", s.hull);
    chips.replaceChildren(
      ...game.chips().map((text) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = text;
        b.addEventListener("click", () => submit(text));
        return b;
      })
    );
    chips.scrollLeft = 0;
  }
  function submit(line) {
    const text = line.trim();
    if (!text) return;
    history.push(text);
    historyAt = history.length;
    print(game.exec(text));
    write(slot(game.state.seed), game.save());
    refresh();
  }
  function begin(seed, fresh = false) {
    log.replaceChildren();
    const saved = fresh ? null : read(slot(seed));
    let resumed = false;
    let outdated = false;
    if (saved) {
      try {
        game = Game.load(saved);
        resumed = true;
      } catch (error) {
        outdated = String(error).includes("older version");
      }
    }
    if (resumed) {
      print([{ k: "dim", s: "Voyage resumed." }, ...game.exec("look").slice(1)]);
    } else {
      game = Game.fresh(seed);
      const notice = outdated ? [{ k: "dim", s: "The galaxy has changed since your last voyage was saved, so that one could not be resumed. This is a new one." }] : [];
      print([...notice, ...game.intro()]);
      write(slot(seed), game.save());
    }
    write("lightspeed.last", String(seed));
    refresh();
  }
  function openMenu(open) {
    panel.hidden = !open;
    log.hidden = open;
    note.textContent = "";
    if (!open) {
      log.scrollTop = log.scrollHeight;
      return;
    }
    const seed = game.state.seed;
    $("seedline").textContent = `Seed ${seed}. A link ending in #seed-${seed} opens this same galaxy for someone else.`;
    $("savetext").value = game.save();
    $("newseed").value = String(Math.floor(Math.random() * 9e5) + 1e5);
    $("begin").textContent = "Begin";
  }
  $("menu").addEventListener("click", () => openMenu(panel.hidden));
  $("close").addEventListener("click", () => openMenu(false));
  $("copy").addEventListener("click", () => {
    const area = $("savetext");
    navigator.clipboard.writeText(area.value).then(
      () => note.textContent = "Save copied.",
      () => {
        area.focus();
        area.select();
        note.textContent = "Could not copy for you. The text is selected: copy it by hand.";
      }
    );
  });
  $("load").addEventListener("click", () => {
    const text = $("loadtext").value.trim();
    try {
      const loaded = Game.load(text);
      game = loaded;
      write(slot(game.state.seed), game.save());
      write("lightspeed.last", String(game.state.seed));
      openMenu(false);
      log.replaceChildren();
      print([{ k: "dim", s: "Voyage loaded." }, ...game.exec("look").slice(1)]);
      refresh();
    } catch (error) {
      note.textContent = String(error).includes("older version") ? "That save is from an older version of the game, and the galaxy has changed since." : "That text is not a save from this game. Check that all of it was pasted.";
    }
  });
  $("begin").addEventListener("click", (event) => {
    const button = event.currentTarget;
    const seed = Number($("newseed").value);
    if (!Number.isInteger(seed) || seed <= 0 || seed >= 2 ** 31) {
      note.textContent = "A seed is a whole number, for example 271828.";
      return;
    }
    if (button.textContent === "Begin" && read(slot(seed))) {
      button.textContent = "Replace the voyage saved under this seed";
      return;
    }
    openMenu(false);
    begin(seed, true);
  });
  $("entry").addEventListener("submit", (event) => {
    event.preventDefault();
    submit(cmd.value);
    cmd.value = "";
  });
  cmd.addEventListener("keydown", (event) => {
    if (event.key === "ArrowUp" && historyAt > 0) {
      cmd.value = history[--historyAt];
      event.preventDefault();
    } else if (event.key === "ArrowDown" && historyAt < history.length) {
      cmd.value = history[++historyAt] ?? "";
      event.preventDefault();
    }
  });
  var viewport = window.visualViewport;
  if (viewport) {
    const fit = () => {
      $("app").style.height = viewport.height < window.innerHeight - 80 ? `${viewport.height}px` : "";
      log.scrollTop = log.scrollHeight;
    };
    viewport.addEventListener("resize", fit);
  }
  begin(seedFromUrl());
})();
</script>
</body>
